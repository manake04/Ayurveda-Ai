name: CI/CD

# One pipeline, not two: the frontend is built exactly once per run and that same
# artifact is both the thing CI checks and the thing that gets deployed, instead of
# building it twice under two separate workflows (as an earlier version of this did).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual re-run from the Actions tab, e.g. after changing repo variables

# Superseded runs on the same branch/PR are cancelled instead of queued, so a burst of
# pushes doesn't pile up redundant runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      # Tests use deterministic fake embedding/LLM models, so no Ollama or API key is
      # needed here. The retrieval-quality eval (python -m eval.run_eval) needs the real
      # models and is run locally before changing models or thresholds.
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set repo variable VITE_API_BASE_URL to your deployed backend's public URL
          # (Settings -> Secrets and variables -> Actions -> Variables) so the live demo
          # can actually reach the API. Falls back to localhost if unset.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Bundle size to job summary
        if: always()
        run: |
          {
            echo "### Frontend bundle"
            echo '```'
            du -ah dist | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on every run (PRs included) so a broken build is visible in the Actions
      # tab; only actually deployed by the job below, and only on a push to main.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Pages enabled once: Settings → Pages → Source: GitHub Actions
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy summary
        run: |
          {
            echo "### Live demo"
            echo "Frontend: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Backend must be deployed separately (Render free tier via render.yaml) --"
            echo "see the README's Deployment section. If VITE_API_BASE_URL isn't set as a"
            echo "repo variable, the deployed frontend falls back to localhost and won't"
            echo "reach a live backend."
          } >> "$GITHUB_STEP_SUMMARY"
